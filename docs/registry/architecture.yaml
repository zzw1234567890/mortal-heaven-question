    adr: ADR-0010
    referenced_by: [ADR-0010]
    note: "const Dictionary[int, Dictionary]——5 级境界 × 15+ 项属性的编译时常量。所有消费者系统通过 get_realm_property() 只读查询——禁止直接写入表内容（GDScript const 不冻结嵌套内容，由团队约定 + GUT 冒烟测试保护）。"
    status: active

  - entity: RealmSystem.DROP_POOL_WEIGHTS（掉落池权重表）
    owner: realm-system
    adr: ADR-0010
    referenced_by: [ADR-0010]
    note: "const Dictionary[int, Dictionary]——pool_tier → {white, blue, purple, gold, darkgold} 稀有度权重映射。CardSystem 通过 get_rarity_weights() 查询。编译时常量，禁止直接写入。"
    status: active

  - entity: StatusEffectSystem._instances + StatusEffectSystem._by_target（运行时状态注册表）
    owner: status-effect-system
    adr: ADR-0011
    referenced_by: [ADR-0011]
    note: "Dictionary[int, StatusInstance] + Dictionary[int, Array[int]]——运行时活跃状态实例的权威注册表（不持久化）。key=status_id 全局唯一递增索引；key=target_id 角色级 O(1) 查询。战斗期间不通过 GSM 存储——战斗结束时通过 serialize_all() 导出快照至 GSM。"
    status: active

  - entity: StatusEffectSystem._templates（状态模板注册表）
    owner: status-effect-system
    adr: ADR-0011
    referenced_by: [ADR-0011]
    note: "Dictionary[StringName, StatusTemplate]——50-80 个只读 StatusTemplate Resource（.tres）。由 StatusEffectSystem._ready() 同步加载填充。通过 get_status_template() 只读访问器封装——防止运行时意外修改 const Dictionary 内容（GDScript const 不冻结嵌套内容，由团队约定 + GUT 冒烟测试保护）。"
    status: active

  - entity: StatusEffectSystem._suspended（暂挂状态注册表）
    owner: status-effect-system
    adr: ADR-0011
    referenced_by: [ADR-0011]
    note: "Dictionary[int, Array[Dictionary]]——key=阵亡角色 ID，value=被暂挂状态的序列化快照列表（非绑定来源的状态）。角色复活时通过 restore_statuses() 反序列化重建；角色永久死亡时清理防止泄漏。"
    status: active

  - entity: BindingManager._bindings + BindingManager._by_character + BindingManager._card_to_character（运行时绑定注册表）
    owner: binding-manager
    adr: ADR-0013
    referenced_by: [ADR-0013]
    note: "Dictionary[int, BindingRecord] + Dictionary[int, Array[int]] + Dictionary[int, int]——战斗期间活跃绑定实例的权威注册表（不持久化）。key=binding_id 全局唯一递增索引；key=character_id O(1) 角色绑定查询；key=card_instance_id O(1) 反向查询。三索引在 _register_binding()/_unregister_binding() 中原子同步更新。战斗期间不通过 GSM 存储——战斗结束时通过 serialize_all() 导出快照至 GSM.battle.bindings。遵循 ADR-0011 的 GSM 例外先例模式。"
    status: active

  - entity: BindingManager._slot_limits（绑定位上限缓存）
    owner: binding-manager
    adr: ADR-0013
    referenced_by: [ADR-0013]
    note: "Dictionary[StringName, int]——战斗开始时从 RealmSystem.get_realm_property() 缓存的当前境界绑定位上限（'gongfa_slots'/'fabao_slots'）。战斗期间境界变更不可行（当前设计）——若未来支持，需添加 realm_changed 信号监听刷新缓存。"
    status: active

interfaces:
  - contract: "GSM 第一层：直接属性读取"
    signature: "GSM.player.*, GSM.collection.*, GSM.deck.*, GSM.exploration.*, GSM.narrative.*, GSM.session.*"
    adr: ADR-0001
    referenced_by: [ADR-0001]
    note: "O(1) 字典访问。无信号开销。每帧读取安全。"
    status: active

  - contract: "ProgressionSystem API——成就域"
    signature: "ProgressionSystem.unlock_achievement(id) → {success, reason} / get_achievement(id) → Dictionary / get_achievements(category) → Array / update_achievement_progress(id, increment) → void"
    adr: ADR-0012
    referenced_by: [ADR-0012]
    note: "失败原因：'already_unlocked' | 'unknown_id'。progress 达到 target 时自动调用 unlock_achievement()。"
    status: active

  - contract: "ProgressionSystem API——天赋域"
    signature: "ProgressionSystem.get_talent_points() → int / add_talent_points(amount) → void / purchase_talent(id) → {success, reason} / grant_talent(id) → {success, reason} / get_talent_tree_state() → Dictionary / set_equipped_talents(ids) → {success, reason} / get_active_slot_count() → int"
    adr: ADR-0012
    referenced_by: [ADR-0012]
    note: "purchase_talent 失败原因：'insufficient_points' | 'prerequisite_locked' | 'already_unlocked' | 'condition_not_met'。grant_talent 不扣除点数——用于 EventSystem GAIN_TALENT Outcome（ADR-0004 迁移目标）。active_slots = 5 + floor(unlocked/4)。"
    status: active

  - contract: "ProgressionSystem API——图鉴/结局/统计/元信息域"
    signature: "mark_card_discovered(id) → void / unlock_ending(id, path, identity, realm) → {success, reason} / increment_stat(key, amount) → void / set_stat(key, value) → void / serialize() → Dictionary / deserialize(data) → bool"
    adr: ADR-0012
    referenced_by: [ADR-0012]
    note: "unlock_ending 原子递增 total_completions 内置——调用方无需额外操作。increment_stat 幂等去重。set_stat 仅当 value > 当前值时写入。serialize/deserialize 由 SaveLoadSystem 调用——替代 GSM.serialize() 用于 progression.dat I/O。"
    status: active

  - contract: "ProgressionSystem 信号总线"
    signature: "signal progression_initialized() / progression_updated(domain, key, old_val, new_val) / achievement_unlocked(ach_id) / talent_purchased(id, points_remaining) / card_discovered(card_id, total) / ending_unlocked(ending_id, total)"
    adr: ADR-0012
    referenced_by: [ADR-0012]
    note: "progression_updated → SaveLoadSystem._atomic_write（同步信号发射+50ms 帧尖峰——通过 batch_update_begin/end 去重）。Cat 2b 信号（achievement_unlocked/talent_purchased/card_discovered/ending_unlocked）→ UI 节点响应。SaveLoadSystem 原监听 GSM.progression_updated——迁移至 ProgressionSystem.progression_updated。"
    status: active

  - contract: "BindingManager 绑定操作 API"
    signature: "bind_card(card_instance_id, template_id, character_id, slot_type) → BindResult / stack_card(card_instance_id, template_id, character_id) → StackResult / overwrite_binding(card_instance_id, template_id, character_id, slot_index) → BindResult / remove_all_bindings(character_id) → Array[Dictionary] / can_bind(character_id, slot_type, template_id) → CanBindResult"
    adr: ADR-0013
    referenced_by: [ADR-0013]
    note: "BindResult = {success, binding_id, reason}——reason: 'bound'|'slot_full'|'invalid_character'|'card_already_bound'。StackResult = {stacked, stack_count, reason}。CanBindResult = {can_bind, can_stack, must_overwrite, slot_index, reason}。remove_all_bindings 返回序列化数据供 CardSystem 洗回牌库。"
    status: active

  - contract: "BindingManager 查询 API"
    signature: "get_bindings_by_character(character_id) → Array[BindingRecord] / get_binding_ids_by_character(character_id) → Array[int] / get_binding(binding_id) → BindingRecord / get_character_by_card(card_instance_id) → int / get_accumulated_bonus(character_id, stat_name) → float / get_binding_context(card_instance_id) → {native_multiplier, stack_count, effective_multiplier}"
    adr: ADR-0013
    referenced_by: [ADR-0013]
    note: "get_binding_ids_by_character() 零分配热路径查询（CombatUI 每帧调用）。get_bindings_by_character() 每次分配新 Array——非热路径使用。get_binding_context() 由 CardEffectEngine 在效果结算时调用——返回预计算的 multiplier 乘积避免引擎中重复计算。"
    status: active

  - contract: "BindingManager 生命周期 API"
    signature: "suspend_bindings(character_id) → void / restore_bindings(character_id) → void / serialize_all() → Dictionary / deserialize_all(data: Dictionary) → void"
    adr: ADR-0013
    referenced_by: [ADR-0013]
    note: "suspend_bindings → CardEffectEngine.suspend_effects_by_source() + BindingRecord.is_suspended=true。restore_bindings → 验证 card_instance_id 存在性→ CardEffectEngine.restore_effects_by_source()。角色离场/上场时 CombatSystem 调用顺序：先 BindingManager.suspend/restore → 后 StatusEffectSystem.suspend/restore（绑定效果可能依赖状态修正值）。deserialize_all 采用尽力而为策略——逐条验证 card_instance_id，失败跳过+WARN。"
    status: active

  - contract: "BindingManager Cat 2b 信号总线"
    signature: "signal binding_applied(binding_id, card_instance_id, template_id, character_id, slot_type, is_native) / binding_removed(binding_id, card_instance_id, character_id, reason) / binding_overwritten(old_binding_id, new_binding_id, character_id, slot_index) / binding_stacked(binding_id, template_id, character_id, new_stack_count) / binding_suspended(character_id, binding_ids) / binding_restored(character_id, binding_ids) / native_activated(binding_id, template_id, character_id)"
    adr: ADR-0013
    referenced_by: [ADR-0013]
    note: "Cat 2b 系统信号——通过 ADR-0007 _emit_signal_safe 包装器路由。binding_applied → CombatUI 创建图标 + Audio 绑定音效；binding_removed → CombatUI 销毁图标+动画；binding_stacked → CombatUI '+1层' 文字特效+徽章更新；native_activated → CombatUI ★ 金色星标亮起 + Audio 金色共鸣音。信号链深度 ≤2 层。"
    status: active

